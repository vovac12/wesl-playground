<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WESL Playground</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #1e1f24; }
      canvas { display: block; width: 100%; height: 100%; outline: none; }
      #status {
        position: fixed; inset: 0; display: grid; place-items: center;
        color: #c9cbd3; font: 15px/1.5 system-ui, sans-serif; text-align: center; padding: 16px;
      }
      #status a { color: #8fb3ff; }
    </style>
  </head>
  <body>
    <canvas id="bevy" tabindex="0"></canvas>
    <div id="status">Loading WESL Playground…</div>
    <script type="module">
      const status = document.getElementById("status");

      // Project files live in IndexedDB; the app keeps a copy in memory and writes through.
      const DB_NAME = "wesl-playground", STORE = "files";
      const db = await new Promise((resolve) => {
        const request = indexedDB.open(DB_NAME, 1);
        request.onupgradeneeded = () => request.result.createObjectStore(STORE);
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => resolve(null);
      });
      const initial = [];
      if (db) {
        await new Promise((resolve) => {
          const cursor = db.transaction(STORE).objectStore(STORE).openCursor();
          cursor.onsuccess = () => {
            const c = cursor.result;
            if (!c) return resolve();
            initial.push([c.key, new Uint8Array(c.value)]);
            c.continue();
          };
          cursor.onerror = () => resolve();
        });
      }
      const write = (fn) => db && fn(db.transaction(STORE, "readwrite").objectStore(STORE));
      window.shadertoyStorage = {
        initialFiles: () => initial,
        // `data` is a view into wasm memory; store a copy.
        put: (path, data) => write((s) => s.put(data.slice().buffer, path)),
        remove: (path) => write((s) => s.delete(path)),
      };

      document.addEventListener("contextmenu", (e) => e.preventDefault());

      if (!navigator.gpu && !document.createElement("canvas").getContext("webgl2")) {
        status.textContent = "This browser supports neither WebGPU nor WebGL2.";
      } else {
        try {
          const { default: init } = await import("./shadertoy.js");
          status.remove();
          await init();
        } catch (e) {
          // winit uses an exception to hand control to the browser's event loop.
          if (!String(e).includes("Using exceptions for control flow")) {
            document.body.append(status);
            status.textContent = `Failed to start: ${e}`;
            throw e;
          }
        }
      }
    </script>
  </body>
</html>
