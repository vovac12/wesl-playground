[package]
name = "shadertoy"
version = "0.1.2"
edition = "2024"

[dependencies]
async-channel = "2.5"
base64 = "0.23"
bevy = { version = "0.20.0", default-features = false, features = [
  "3d",
  "ui",
  "free_camera",
  "jpeg",
] }
futures-lite = "2.6"
futures-timer = "3.0"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bevy = { version = "0.20.0", default-features = false, features = ["file_watcher"] }
tiny_http = "0.12.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
futures-timer = { version = "3.0", features = ["wasm-bindgen"] }
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

# Bevy is slow in debug builds; optimize dependencies but keep our crate fast to compile.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Smaller, faster wasm for the web build.
[profile.web-release]
inherits = "release"
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
