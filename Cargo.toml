[package]
name = "shadertoy"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.23"
bevy = { version = "0.20.0", default-features = false, features = [
  "3d",
  "ui",
  "free_camera",
  "file_watcher",
  "jpeg",
] }
crossbeam-channel = "0.5.17"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
tiny_http = "0.12.0"

# Bevy is slow in debug builds; optimize dependencies but keep our crate fast to compile.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
